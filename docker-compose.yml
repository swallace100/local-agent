# Private metasearch backend for the agent's web_search tool.
# Bound to localhost so it is not reachable from other machines.
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-local-only-not-exposed-beyond-localhost}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
